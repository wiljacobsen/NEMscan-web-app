services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: nemscan
      POSTGRES_USER: nemscan
      POSTGRES_PASSWORD: nemscan_dev
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nemscan"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
